<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralTok - Firebase Version</title>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .auth-card {
            background: #0a0a0a;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .auth-logo {
            font-size: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff006e, #fb5607);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        .auth-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #ff006e;
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff006e, #fb5607);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #999;
        }

        .toggle-auth a {
            color: #ff006e;
            cursor: pointer;
            text-decoration: none;
        }

        .toggle-auth a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff1744;
            font-size: 14px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 23, 68, 0.1);
            border-radius: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* App Container */
        .app-container {
            display: none;
            flex: 1;
        }

        .app-container.active {
            display: flex;
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff006e, #fb5607);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-item {
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .feed-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .video-card {
            background: #1a1a2e;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .video-header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff006e, #fb5607);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
        }

        .timestamp {
            font-size: 12px;
            color: #999;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-footer {
            padding: 15px;
        }

        .video-description {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .video-actions {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            color: #ff006e;
        }

        .action-btn.liked {
            color: #ff006e;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff006e;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }

        .upload-preview {
            width: 100%;
            height: 250px;
            background: #0a0a0a;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-preview video,
        .upload-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-input-label {
            display: block;
            padding: 12px 20px;
            background: linear-gradient(45deg, #ff006e, #fb5607);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff006e, #fb5607);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .profile-email {
            color: #999;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: #ff006e;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #c1121f;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #ff006e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Auth Container -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="auth-logo">🎬</div>
            <div class="auth-title" id="authTitle">Login</div>

            <div class="error-message" id="errorMessage"></div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="authEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="authPassword" placeholder="Enter your password">
            </div>

            <div class="form-group" id="nameGroup" style="display: none;">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" id="authName" placeholder="Enter your name">
            </div>

            <button class="btn-primary" id="authBtn" onclick="handleAuth()">Login</button>

            <div class="toggle-auth">
                <span id="toggleText">Don't have an account? </span>
                <a onclick="toggleAuthMode()">Sign up</a>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div class="app-container" id="appContainer">
        <div class="app-layout">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="logo">🎬 ViralTok</div>

                <div class="nav-item active" onclick="switchPage('home')">
                    <span>🏠</span>
                    <span>Home</span>
                </div>

                <div class="nav-item" onclick="switchPage('explore')">
                    <span>🔍</span>
                    <span>Explore</span>
                </div>

                <div class="nav-item" onclick="openUploadModal()">
                    <span>➕</span>
                    <span>Upload</span>
                </div>

                <div class="nav-item" onclick="switchPage('profile')">
                    <span>👤</span>
                    <span>Profile</span>
                </div>

                <div class="nav-item" onclick="logout()" style="margin-top: auto; color: #c1121f;">
                    <span>🚪</span>
                    <span>Logout</span>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="feed-section" id="feedSection"></div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeUploadModal()">✕</button>
            <div class="modal-header">📹 Upload Video</div>

            <div class="upload-preview" id="uploadPreview">
                <span style="text-align: center; color: #999;">Video preview will appear here</span>
            </div>

            <div class="file-input-label">
                Choose Video 📹
                <input type="file" id="videoInput" accept="video/*" onchange="previewUpload(event)">
            </div>

            <div class="form-group">
                <label class="form-label">Video Title</label>
                <input type="text" class="form-input" id="videoTitle" placeholder="Enter video title...">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input" id="videoDescription" placeholder="Add description..." style="min-height: 80px;"></textarea>
            </div>

            <button class="btn-primary" onclick="uploadVideo()">🚀 Publish</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDemoKey123456789",
            authDomain: "viraltok-app.firebaseapp.com",
            projectId: "viraltok-app",
            storageBucket: "viraltok-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Note: Replace above config with your actual Firebase config from Firebase Console

        let db, auth, storage;
        let currentUser = null;
        let isSignUp = false;

        // Initialize Firebase (when user adds real config)
        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
                storage = firebase.storage();
                console.log("Firebase initialized");
            } catch (error) {
                console.log("Firebase not configured - using local storage mode");
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initFirebase();
            checkAuth();
        });

        // Check authentication status
        function checkAuth() {
            if (auth) {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        currentUser = user;
                        showApp();
                        loadFeed();
                    } else {
                        showAuth();
                    }
                });
            } else {
                // Demo mode without Firebase
                currentUser = { uid: 'demo', email: 'demo@viraltok.com', displayName: 'Demo User' };
                showApp();
                loadDemoFeed();
            }
        }

        // Toggle auth mode
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            const authTitle = document.getElementById('authTitle');
            const authBtn = document.getElementById('authBtn');
            const toggleText = document.getElementById('toggleText');
            const nameGroup = document.getElementById('nameGroup');

            if (isSignUp) {
                authTitle.textContent = 'Sign Up';
                authBtn.textContent = 'Create Account';
                toggleText.textContent = 'Already have an account? ';
                nameGroup.style.display = 'block';
            } else {
                authTitle.textContent = 'Login';
                authBtn.textContent = 'Login';
                toggleText.textContent = "Don't have an account? ";
                nameGroup.style.display = 'none';
            }
        }

        // Handle authentication
        async function handleAuth() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errorMsg = document.getElementById('errorMessage');

            if (!email || !password) {
                showError('Please fill all fields');
                return;
            }

            try {
                if (!auth) {
                    // Demo mode
                    currentUser = { uid: 'demo', email: email, displayName: 'User' };
                    showApp();
                    loadDemoFeed();
                    return;
                }

                if (isSignUp) {
                    const name = document.getElementById('authName').value;
                    if (!name) {
                        showError('Please enter your name');
                        return;
                    }

                    const result = await auth.createUserWithEmailAndPassword(email, password);
                    await result.user.updateProfile({ displayName: name });
                    currentUser = result.user;
                } else {
                    const result = await auth.signInWithEmailAndPassword(email, password);
                    currentUser = result.user;
                }

                showApp();
                loadFeed();
                errorMsg.classList.remove('show');
            } catch (error) {
                showError(error.message);
            }
        }

        // Show error message
        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }

        // Show auth container
        function showAuth() {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('active');
        }

        // Show app
        function showApp() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
        }

        // Logout
        function logout() {
            if (auth) {
                auth.signOut();
            }
            currentUser = null;
            showAuth();
            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
        }

        // Load demo feed
        function loadDemoFeed() {
            const feedSection = document.getElementById('feedSection');
            feedSection.innerHTML = `
                <div style="text-align: center; padding: 40px 20px; color: #999;">
                    <div style="font-size: 60px; margin-bottom: 20px;">⚙️</div>
                    <h3>Firebase Not Configured</h3>
                    <p style="margin-top: 10px;">
                        To enable this app, add your Firebase config to the JavaScript code.
                    </p>
                    <div style="background: #1a1a2e; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: left;">
                        <p style="font-size: 12px; margin-bottom: 10px;">📝 Steps to configure:</p>
                        <ol style="font-size: 12px; margin-left: 20px;">
                            <li>Go to firebase.google.com</li>
                            <li>Create new project</li>
                            <li>Enable Auth, Firestore, Storage</li>
                            <li>Copy config to the code</li>
                            <li>Refresh this page</li>
                        </ol>
                    </div>
                </div>
            `;
        }

        // Load feed from Firebase
        async function loadFeed() {
            const feedSection = document.getElementById('feedSection');
            feedSection.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                if (!db) {
                    loadDemoFeed();
                    return;
                }

                const snapshot = await db.collection('videos').orderBy('timestamp', 'desc').limit(20).get();
                feedSection.innerHTML = '';

                if (snapshot.empty) {
                    feedSection.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">📹 No videos yet. Be the first to upload!</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const video = doc.data();
                    feedSection.innerHTML += createVideoCard(doc.id, video);
                });
            } catch (error) {
                console.error('Error loading feed:', error);
                loadDemoFeed();
            }
        }

        // Create video card
        function createVideoCard(videoId, video) {
            return `
                <div class="video-card">
                    <div class="video-header">
                        <div class="user-avatar">${video.creatorAvatar || '👤'}</div>
                        <div class="user-info">
                            <div class="username">${video.creatorName}</div>
                            <div class="timestamp">${new Date(video.timestamp).toLocaleDateString()}</div>
                        </div>
                    </div>

                    <div class="video-container">
                        <video controls style="width: 100%; height: 100%; object-fit: cover;">
                            <source src="${video.videoUrl}" type="video/mp4">
                        </video>
                    </div>

                    <div class="video-footer">
                        <div class="video-description"><strong>${video.title}</strong></div>
                        <div class="video-description" style="color: #999; font-size: 13px;">${video.description}</div>

                        <div class="video-actions">
                            <button class="action-btn" onclick="likeVideo('${videoId}')">
                                <span>❤️</span>
                                <span>${video.likes || 0}</span>
                            </button>
                            <button class="action-btn">
                                <span>💬</span>
                                <span>${video.comments || 0}</span>
                            </button>
                            <button class="action-btn">
                                <span>📤</span>
                                <span>${video.shares || 0}</span>
                            </button>
                            <button class="action-btn">
                                <span>👁️</span>
                                <span>${video.views || 0}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Like video
        async function likeVideo(videoId) {
            if (!db) return;

            try {
                const videoRef = db.collection('videos').doc(videoId);
                await videoRef.update({
                    likes: firebase.firestore.FieldValue.increment(1)
                });
                loadFeed();
            } catch (error) {
                console.error('Error liking video:', error);
            }
        }

        // Open upload modal
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        // Close upload modal
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('videoInput').value = '';
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoDescription').value = '';
        }

        // Preview upload
        function previewUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('uploadPreview');
                    preview.innerHTML = `<video controls style="width: 100%; height: 100%;"><source src="${e.target.result}" type="video/mp4"></video>`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Upload video
        async function uploadVideo() {
            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDescription').value;
            const file = document.getElementById('videoInput').files[0];

            if (!title || !description || !file) {
                alert('Please fill all fields');
                return;
            }

            if (!db) {
                alert('Firebase not configured. Demo mode only.');
                return;
            }

            try {
                const uploadBtn = event.target;
                uploadBtn.disabled = true;
                uploadBtn.textContent = '⏳ Uploading...';

                // Upload file to Storage
                const storageRef = storage.ref(`videos/${Date.now()}_${file.name}`);
                const uploadTask = await storageRef.put(file);
                const downloadUrl = await uploadTask.ref.getDownloadURL();

                // Save video metadata to Firestore
                await db.collection('videos').add({
                    title: title,
                    description: description,
                    videoUrl: downloadUrl,
                    creatorId: currentUser.uid,
                    creatorName: currentUser.displayName || 'Anonymous',
                    creatorEmail: currentUser.email,
                    creatorAvatar: '👤',
                    timestamp: new Date(),
                    likes: 0,
                    comments: 0,
                    shares: 0,
                    views: 0
                });

                uploadBtn.disabled = false;
                uploadBtn.textContent = '🚀 Publish';
                closeUploadModal();
                loadFeed();
                alert('✅ Video uploaded successfully!');
            } catch (error) {
                console.error('Upload error:', error);
                alert('❌ Upload failed: ' + error.message);
                uploadBtn.disabled = false;
                uploadBtn.textContent = '🚀 Publish';
            }
        }

        // Switch page
        function switchPage(page) {
            const feedSection = document.getElementById('feedSection');

            switch(page) {
                case 'home':
                    loadFeed();
                    break;
                case 'explore':
                    feedSection.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">🔍 Explore coming soon...</div>';
                    break;
                case 'profile':
                    showProfile();
                    break;
            }

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
        }

        // Show profile
        function showProfile() {
            const feedSection = document.getElementById('feedSection');
            const userName = currentUser?.displayName || currentUser?.email || 'User';

            feedSection.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto;">
                    <div class="profile-header">
                        <div class="profile-avatar">👤</div>
                        <div class="profile-name">${userName}</div>
                        <div class="profile-email">${currentUser?.email || 'No email'}</div>
                    </div>

                    <div class="profile-stats">
                        <div class="stat">
                            <div class="stat-number">0</div>
                            <div class="stat-label">Videos</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">0</div>
                            <div class="stat-label">Followers</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">0</div>
                            <div class="stat-label">Following</div>
                        </div>
                    </div>

                    <button class="btn-primary" onclick="openUploadModal()">📹 Upload Video</button>
                    <button class="btn-secondary" onclick="logout()">🚪 Logout</button>
                </div>
            `;
        }
    </script>
</body>
</html>
